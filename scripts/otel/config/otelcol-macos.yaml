receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 128
    spike_limit_mib: 32
  resource/control_room:
    attributes:
      - {key: deployment.environment.name, value: "${env:CONTROL_ROOM_ENVIRONMENT}", action: upsert}
      - {key: controlroom.source.role, value: "${env:CONTROL_ROOM_SOURCE_ROLE}", action: upsert}
      - {key: controlroom.capture_node_id, value: "${env:CONTROL_ROOM_CAPTURE_NODE_ID}", action: upsert}
      - {key: host.name, value: "${env:CONTROL_ROOM_HOSTNAME}", action: upsert}
      - {key: os.type, value: darwin, action: upsert}
      - {key: controlroom.collector.version, value: "${env:CONTROL_ROOM_COLLECTOR_VERSION}", action: upsert}
  filter/lean_traces:
    error_mode: propagate
    trace_conditions:
      - context: span
        conditions:
          - 'span.name == "receiving"'
          - 'span.name == "append_items"'
          - 'span.name == "persist_rollout_items"'
          - 'span.name == "handle_responses" and Len(span.attributes) == 9 and Len(span.events) == 0 and span.status.code != STATUS_CODE_ERROR'
  attributes/lean_traces:
    actions:
      - {key: code.file.path, action: delete}
      - {key: code.module.name, action: delete}
      - {key: code.line.number, action: delete}
      - {key: thread.name, action: delete}
      - {key: target, action: delete}
      - {key: busy_ns, action: delete}
      - {key: idle_ns, action: delete}
  transform/lean_traces:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - 'delete_key(span.attributes, "thread.id") where IsInt(span.attributes["thread.id"])'
  attributes/privacy_logs:
    actions:
      - {key: arguments, action: delete}
      - {key: output, action: delete}
      - {key: user.email, action: delete}
      - {key: user.account_id, action: delete}
      - {key: error.message, action: delete}
  batch:
    timeout: 2s
    send_batch_size: 256

exporters:
  file/logs:
    path: "${env:CONTROL_ROOM_OTEL_HOME}/data/lean/logs/logs.otlp.json"
    format: json
    create_directory: true
    rotation: {max_megabytes: 16, max_backups: 512, max_days: 60, localtime: false}
  file/traces:
    path: "${env:CONTROL_ROOM_OTEL_HOME}/data/lean/traces/traces.otlp.json"
    format: json
    create_directory: true
    rotation: {max_megabytes: 16, max_backups: 1536, max_days: 60, localtime: false}
  file/metrics:
    path: "${env:CONTROL_ROOM_OTEL_HOME}/data/lean/metrics/metrics.otlp.json"
    format: json
    create_directory: true
    rotation: {max_megabytes: 16, max_backups: 512, max_days: 60, localtime: false}
  file/forensic_traces:
    path: "${env:CONTROL_ROOM_OTEL_HOME}/data/forensic/traces/traces.otlp.json"
    format: json
    create_directory: true
    rotation: {max_megabytes: 16, max_backups: 256, max_days: 3, localtime: false}

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  telemetry:
    resource:
      attributes:
        - {name: controlroom.capture_node_id, value: "${env:CONTROL_ROOM_CAPTURE_NODE_ID}"}
        - {name: controlroom.source.role, value: otel-collector-mac}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/control_room, attributes/privacy_logs, batch]
      exporters: [file/logs]
    traces/lean:
      receivers: [otlp]
      processors: [memory_limiter, resource/control_room, filter/lean_traces, transform/lean_traces, attributes/lean_traces, batch]
      exporters: [file/traces]
    traces/forensic:
      receivers: [otlp]
      processors: [memory_limiter, resource/control_room, batch]
      exporters: [file/forensic_traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/control_room, batch]
      exporters: [file/metrics]
